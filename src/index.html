<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Bun WebSocket Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    #log {
      border: 1px solid #ccc;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    input {
      width: 300px;
      padding: 8px;
    }
    button {
      padding: 8px 12px;
    }
  </style>
</head>
<body>

  <h2>Bun WebSocket Example</h2>

  <div id="log"></div>

  <input id="msg" placeholder="Type a message..." />
  <button onclick="sendMsg()">Send</button>

  <script>
    const log = document.getElementById("log");

    function addLine(text) {
      const div = document.createElement("div");
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    // Connect to Bun WebSocket server
    const ws = new WebSocket("ws://localhost:3000/ws");

    ws.onopen = () => {
      addLine("Connected to server");
    };

    ws.onmessage = (event) => {
      addLine("Server: " + event.data);
    };

    ws.onclose = () => {
      addLine("Disconnected from server");
    };

    function sendMsg() {
      const input = document.getElementById("msg");
      const value = input.value;

      if (!value) return;

      ws.send(value);
      addLine("You: " + value);
      input.value = "";
    }
  </script>

</body>
</html>
