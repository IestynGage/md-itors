<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Bun WebSocket Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    #log {
      border: 1px solid #ccc;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
      width: 100%;
    }
    textarea {
      border: 1px solid #ccc;
      padding: 10px;
      height: 200px;
      /* overflow-y: auto; */
      margin-bottom: 10px;
      width: 100%;

    }
    button {
      padding: 8px 12px;
    }
  </style>
</head>
<body>

  <h2>Bun WebSocket Example</h2>

  <div id="log"></div>

  <textarea id="msg" type="text" placeholder="Type a message..." >
  </textarea>

  <br/>

  <button onclick="sendMsg()">Send</button>

  <script>
    const log = document.getElementById("log");
    const msgTextArea = document.getElementById("msg");

    function addLine(text) {
      const div = document.createElement("div");
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    // Connect to Bun WebSocket server
    const ws = new WebSocket("ws://localhost:3000/ws");

    ws.onopen = () => {
      addLine("Connected to server");
    };

    ws.onmessage = (event) => {
      addLine("Server: " + event.data);
      console.log(event.data)
      const a = JSON.parse(event.data)
      switch(a.type) {
        case 'CarrotMove':
          console.log('Hello')
          break;
        default:
          updateBox(event.data);
          break;
      }
    };

    ws.onclose = () => {
      addLine("Disconnected from server");
    };

    function updateBox(newValue) {
      const input = document.getElementById("msg");
      input.value = newValue;
    }


    msgTextArea.addEventListener('selectionchange', (event) => {
      console.log(`${msgTextArea.selectionStart} ${msgTextArea.selectionEnd}`);

      ws.send(JSON.stringify({
        "type":"CarrotMove",
        "startIndex": msgTextArea.selectionStart,
        "endIndex": msgTextArea.selectionEnd

      }));
    })
    
    function sendMsg() {
      const input = document.getElementById("msg");
      const value = input.value;

      if (!value) return;

      ws.send(value);
      addLine("You: " + value);
    }
  </script>

</body>
</html>
