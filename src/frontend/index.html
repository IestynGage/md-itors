<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>md-itors</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    #log {
      border: 1px solid #ccc;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
      width: 100%;
    }
    textarea {
      border: 1px solid #ccc;
      padding: 10px;
      height: 200px;
      /* overflow-y: auto; */
      margin-bottom: 10px;
      width: 100%;

    }
    #text-area {
      border: 1px solid #ccc;
      height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
      width: 100%;
      padding: 4px;
    }
    button {
      padding: 8px 12px;
    }
    .line {
      border: 0px;
      height: 15px;
      width: calc(100% - 8px);
      overflow: hidden;
      margin: 0 0 2px 0;
      padding: 4px;
      resize: none;
    }
  </style>
</head>
<body>

  <h2>md-itors</h2>

  <div id="log"></div>


  <div id="text-area">

  </div>

  <br/>

  <button onclick="sendMsg()">Send</button>

  <script>
    const log = document.getElementById("log");
    const markdownDiv = document.getElementById("text-area");

    let lines = []

    function addStorageLine(afterId, id, content){

      if (afterId === undefined) {
        lines = [{id:0, content: content}]
      }
      else {
        // lines.push({id: id, content: content});
        const afterIndex = lines.findIndex(x => x.id == afterId) + 1;
        console.log('afterIndex', afterIndex)
        lines = [
            ...lines.slice(0, afterIndex),
            {id: id, content: content},
            ...lines.slice(afterIndex)
        ];
      }
    }

    function addLine(text) {
      const div = document.createElement("div");
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }


    addStorageLine(undefined, undefined, 'world');
    addStorageLine(0, 1, 'Hello');
    renderMarkdown();

    function renderMarkdown(lineToFocus) {
      markdownDiv.innerHTML = ""
      let divToFocus = null;
      lines.forEach((line,i) => {
        const div = document.createElement("textarea");
        div.id = `${line.id}`;
        div.className = "line"
        div.value = line.content;
        markdownDiv.appendChild(div);

        console.log(`${line.id} == ${lineToFocus}`);
        if (lineToFocus === line.id) {
          console.log("here")
          divToFocus = div;
        }
      });

      if (divToFocus !== null) {
        divToFocus.focus();
        setElementCursor(divToFocus, 0, 0);
        console.log('focus')
      }
    }

    // Connect to Bun WebSocket server
    const ws = new WebSocket("ws://localhost:3000/ws");

    ws.onopen = () => {
      addLine("Connected to server");
    };

    ws.onmessage = (event) => {
      addLine("Server: " + event.data);
      console.log(event.data)
      const a = JSON.parse(event.data)
      switch(a.type) {
        case 'CarrotMove':
          console.log('Hello')
          break;
        default:
          updateBox(event.data);
          break;
      }
    };

    ws.onclose = () => {
      addLine("Disconnected from server");
    };

    function updateBox(newValue) {
      // textArea = newValue;
    }


    let carrotPosition = [];
    let focusedItem = null;

    function recordCarrotPosition(event) {
      console.log(`$carrot {event.target.selectionStart} ${event.target.selectionEnd}`);
      // addLine('lineN' + event.target.selectionStart);
      carrotPosition = [event.target.selectionStart, event.target.selectionEnd];
        ws.send(JSON.stringify({
          "type":"CarrotMove",
          "startIndex": event.target.selectionStart,
          "endIndex": event.target.selectionEnd
        }));
    }

    document.addEventListener('focusin', (event) => {
      console.log('focusin', event.target.id)
      
      if (focusedItem !== null) {
        focusedItem.removeEventListener('selectionchange', recordCarrotPosition);
      }
      event.target.addEventListener('selectionchange', recordCarrotPosition);

      focusedItem = event.target;
    })

    markdownDiv.addEventListener('click', (event) => {
      const elemId = event.target.id
      const value = event.key;
      carrotPosition = [event.target.selectionStart, event.target.selectionEnd];
    })

    markdownDiv.addEventListener('keydown', (event) => {
      const elemId = event.target.id
      const value = event.key;
      addLine("event " + event.key);

      if (event.key === 'Enter' || event.keyCode === 13) {
        event.preventDefault();
        event.stopPropagation();
        // Does 2 things here: 
        // * Moves the text right of the caret to the new line.
        // * Deletes the currently highlighted text.
        const newLineId = lines.length;

        const currentLine = lines.findIndex(x => x.id == elemId);
        const newLineContent = lines[currentLine].content.slice(carrotPosition[1]);
        lines[currentLine] = { id: lines[currentLine].id, content: lines[currentLine].content.slice(0, carrotPosition[0])}

        addStorageLine(elemId, newLineId, newLineContent);
        renderMarkdown(newLineId);
      }
      else if(event.key === 'ArrowDown') {
        const nextElem = event.target.nextElementSibling;
        if (nextElem) {
          nextElem.focus();
        }
      } else if (event.key === 'ArrowUp') {
        const prevElem = event.target.previousElementSibling;
        if (prevElem) {
          prevElem.focus();
        }
      }
      else if (event.key === 'Backspace') {
        if (carrotPosition[0] === carrotPosition[1] && carrotPosition[0] === 0) {
          const prevElemId = event.target.previousElementSibling.id;
          let lineIndex = lines.findIndex(v => v.id == elemId);
          lines = [ ...lines.slice(0, lineIndex), ...lines.slice(lineIndex+1)];
          renderMarkdown();
          if (prevElemId) { 
            event.preventDefault();// move this to the top of THIS function
            event.stopPropagation();
            console.log('aboute to fixus')
            const prevLine = document.getElementById(prevElemId);
            setElementCursor(prevLine, prevLine.value.length, prevLine.value.length);
            prevLine.focus();
            // combine "current line" with this line if deleting line with content.
          }
        }
      }
      else if (event.key === 'ArrowLeft') {
        addLine('id ' + event.target.id + ' carrotPosition ' + carrotPosition[0])
        if (carrotPosition[0] === 0) {
          moveCursorUp(event);
        }
      }
      else if (event.key === 'ArrowRight') {
        const length = event.target.value.length; //TODO check this
        if (carrotPosition[1] === length) {
          moveCursorDown(event);
        }
      }
      else {
        let line = lines.findIndex(v => v.id == elemId);
        
        let content = lines[line].content;
        const endContent = content.substring(carrotPosition[1]);
        content = content.substring(0, carrotPosition[0]) + value + endContent;
        carrotPosition = [carrotPosition[0] + 1, carrotPosition[0] + 1];

        lines[line] = { id: lines[line].id, content: content };
      }
      addLine(`onInput ${event.data}`);
      addLine(`data ${event.inputType}`);
    });

    function renderLines() {
      // TODO
    }

    function moveCursorUp(event) {
      const prevElem = event.target.previousElementSibling;
      if (prevElem) {
        setElementCursor(prevElem, prevElem.value.length, prevElem.value.length);
        prevElem.focus();
        event.preventDefault();
        event.stopPropagation();
      }
    }

    function moveCursorDown(event) {
      const nextELem = event.target.nextElementSibling;
      if (nextELem) {
        setElementCursor(nextELem, 0, 0)
        nextELem.focus();
        event.preventDefault();
        event.stopPropagation();
      }
    }
    
    function setElementCursor(element, start, end) {
      element.setSelectionRange(start, end);
      carrotPosition = [start, end];
    }

    function sendMsg() {
      const input = document.getElementById("msg");
      const value = input.value;

      if (!value) return;

      ws.send(value);
      addLine("You: " + value);
    }
  </script>

</body>
</html>
