<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>md-itors</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    #log {
      border: 1px solid #ccc;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
      width: 100%;
    }
    textarea {
      border: 1px solid #ccc;
      padding: 10px;
      height: 200px;
      /* overflow-y: auto; */
      margin-bottom: 10px;
      width: 100%;

    }
    #text-area {
      border: 1px solid #ccc;
      height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
      width: 100%;
      padding: 4px;
    }
    button {
      padding: 8px 12px;
    }
    .line {
      border: 0px;
      height: 15px;
      width: calc(100% - 8px);
      overflow: hidden;
      margin: 0 0 2px 0;
      padding: 4px;
      resize: none;
    }
  </style>
</head>
<body>

  <h2>md-itors</h2>

  <div id="log"></div>


  <div id="text-area">

  </div>

  <br/>

  <button onclick="sendMsg()">Send</button>

  <script>
    const log = document.getElementById("log");
    const textArea = document.getElementById("text-area");

    let lines = []

    function addStorageLine(afterId, content){

      if (afterId === undefined) {
        lines = [{id:0, content: content}]
      }
      else {
        lines.push({id: afterId, content: content});
        addLine("newLine");
      }
    }

    function addLine(text) {
      const div = document.createElement("div");
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }


    addStorageLine(0, 'Hello');
    addStorageLine(1, 'world');
    renderMarkdown();

    function renderMarkdown(lineToFocus) {
      textArea.innerHTML = ""
      addLine("renderMarkdown");
      let divToFocus = null;
      lines.forEach((line,i) => {
        const div = document.createElement("div");
        div.contentEditable=true;
        div.id = `lineN${i}`;
        div.className = "line"
        div.innerHTML = line.content;
        textArea.appendChild(div);

        console.log(`${line.id} == ${lineToFocus}`);
        if (lineToFocus === line.id) {
          console.log("here")
          divToFocus = div;
        }
      });

      if (divToFocus !== null) {
        divToFocus.focus();
        console.log('focus')
      }
    }

    // Connect to Bun WebSocket server
    const ws = new WebSocket("ws://localhost:3000/ws");

    ws.onopen = () => {
      addLine("Connected to server");
    };

    ws.onmessage = (event) => {
      addLine("Server: " + event.data);
      console.log(event.data)
      const a = JSON.parse(event.data)
      switch(a.type) {
        case 'CarrotMove':
          console.log('Hello')
          break;
        default:
          updateBox(event.data);
          break;
      }
    };

    ws.onclose = () => {
      addLine("Disconnected from server");
    };

    function updateBox(newValue) {
      // textArea = newValue;
    }


    textArea.addEventListener('selectionchange', (event) => {
      console.log(`${event.target.selectionStart} ${event.target.selectionEnd}`);
      // addLine('lineN' + event.target.selectionStart);
      
      ws.send(JSON.stringify({
        "type":"CarrotMove",
        "startIndex": event.target.selectionStart,
        "endIndex": event.target.selectionEnd

      }));
    })

    textArea.addEventListener('keydown', (event) => {
      const value = event.target.value;
      addLine("event" + event.key);

      if (event.key === 'Enter' || event.keyCode === 13) {
        addLine(event.target.id)
        addStorageLine(lines.length, "");
        renderMarkdown(lines.length - 1);
      }
      else if(event.key === 'ArrowDown') {
        const nextElem = event.target.nextElementSibling;
        if (nextElem) {
          nextElem.focus();
        }
      } else if (event.key === 'ArrowUp') {
        const prevElem = event.target.previousElementSibling;
        if (prevElem) {
          prevElem.focus();
        }
      }
      // I
      addLine(`onInput ${event.data}`);
      addLine(`data ${event.inputType}`);
    });
    
    function sendMsg() {
      const input = document.getElementById("msg");
      const value = input.value;

      if (!value) return;

      ws.send(value);
      addLine("You: " + value);
    }
  </script>

</body>
</html>
